# 只写与官方默认不同的设置，其余全部使用 yazi 26.9 内置默认。
# 官方默认值：https://github.com/sxyazi/yazi/blob/v26.9.1/yazi-config/preset/yazi-default.toml

[mgr]
sort_by = "natural"

[opener]
# $EDITOR 未设置时用 nvim（默认是 vi）
edit = [
	{ run = '${EDITOR:-nvim} %s', desc = "$EDITOR", block = true, for = "unix" },
]
# 用 ouch 解压（默认用 ouch 插件的 ya pub extract）
extract = [
	{ run = 'ouch d -y %s', desc = "Extract here with ouch", for = "unix" },
]
# 用 mpv 播放（默认用 xdg-open）
play = [
	{ run = 'mpv --force-window %s', orphan = true, for = "unix" },
]

[plugin]
# 每行的 git 状态（git 插件）
prepend_fetchers = [
	{ url = "*",  run = "git", group = "git" },
	{ url = "*/", run = "git", group = "git" },
]
# 压缩包预览带文件图标（ouch 插件）
prepend_previewers = [
	{ mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch --show-file-icons" },
]
