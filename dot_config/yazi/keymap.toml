# 只列与官方默认不同的键位；其余全部使用 yazi 26.9 内置默认。
# prepend_keymap 插在默认键位之前（优先级更高）。

[mgr]
prepend_keymap = [
	# 目录进入 / 文件打开
	{ on = "<Enter>", run = "plugin smart-enter", desc = "Enter directory / open file" },
	{ on = "l",       run = "plugin smart-enter", desc = "Enter directory / open file" },

	# 复制到系统剪贴板（Wayland）
	{ on = "y", run = [ 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank" ], desc = "Yank + copy to system clipboard" },

	# 搜索与跳转（默认 s=按名搜索 fd、S=按内容搜索 rg，这里让 s 走 jump-to-char）
	{ on = "s",     run = "plugin jump-to-char", desc = "Jump to char" },
	{ on = "S",     run = "search --via=fd",     desc = "Search files by name via fd" },
	{ on = "<C-p>", run = "plugin fzf",          desc = "Jump via fzf" },

	# 工具
	{ on = "<C-g>", run = "shell --confirm --block lazygit", desc = "Lazygit" },
	{ on = "M",     run = "plugin mount",                    desc = "Mount manager" },
	{ on = "T",     run = "plugin toggle-pane max-preview",  desc = "Maximize or restore the preview pane" },
	{ on = [ "c", "m" ], run = "plugin chmod", desc = "Chmod selected files" },
	{ on = [ "c", "D" ], run = "plugin diff",  desc = "Diff hovered against selected file" },
	{ on = [ "g", "r" ], run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"', desc = "Cd to the root of the current Git repository" },

	# 书签
	{ on = "m",            run = "plugin bookmarks save",       desc = "Save current position as a bookmark" },
	{ on = "'",            run = "plugin bookmarks jump",       desc = "Jump to a bookmark" },
	{ on = [ "b", "d" ],   run = "plugin bookmarks delete",     desc = "Delete a bookmark" },
	{ on = [ "b", "D" ],   run = "plugin bookmarks delete_all", desc = "Delete all bookmarks" },
]
