# ── Scroller (横滚布局) ──
# 窗口沿水平方向排列, 适合多窗口横向浏览
# 最大结构数量
scroller_structs=20
# 默认窗口宽度比例
scroller_default_proportion=0.8
# 焦点窗口是否居中
scroller_focus_center=0
# 切换时优先居中
scroller_prefer_center=1
# 鼠标移到边缘自动滚屏
edge_scroller_pointer_focus=1
# 单窗口时占满
scroller_default_proportion_single=1.0
# 预设宽度比例
scroller_proportion_preset=0.5,0.8,1.0

# ── Master-Stack (主从平铺) ──
# master 区 + stack 区, 适合代码/文档编辑
# 新窗口成为 master
new_is_master=1
# 单窗口时保留间距
smart_gaps=0
# master 区占比 (55%)
default_master_factor=0.55
# master 区窗口数
default_master_count=1

# ── Monocle (全屏堆叠, SUPER+SHIFT+m) ──
# 标签页模式 (0.18.0): 顶部出现标题栏, 像浏览器多标签一样点击/切换
monocle_tab_mode=1
group_bar_close_button_enable=1
# 常驻组栏 (0.18.0): 组栏常显示, 可把窗口拖到组栏、按住组栏边缘缩放
always_show_group_bar=1
# 去间距, 视图更满屏
monocle_no_gap=1

# ── Dwindle (二分树, SUPER+SHIFT+d) ──
# 手动分割模式: 配合 SUPER+SHIFT+\ 切换焦点分支的横/纵方向
dwindle_manual_split=1
