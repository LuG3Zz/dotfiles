# ═══════════════════ 窗口规则 ═══════════════════
# 格式: window_rule=<属性>:<值>,<条件>

# ── 文件选择对话框 (浮动, 仅打开时应用一次) ──
window_rule_once=is_floating:1,app_id:xdg-desktop-portal-gtk,title:打开本地仓库
window_rule_once=is_floating:1,app_id:xdg-desktop-portal-gtk,title:打开文件

# ── 迅雷 (浮动，固定大小) ──
window_rule=is_floating:1,no_size_hint:1,title:迅雷
window_rule=width:800,height:900,title:迅雷

# ── Translate 翻译工具 (浮动，固定大小) ──
window_rule=is_floating:1,title:Translate
window_rule=width:800,height:900,title:Translate

# ── OBS Studio (全局快捷键) ──
window_rule=global_key_binding:ctrl+alt-o,app_id:com.obsproject.Studio
window_rule=global_key_binding:ctrl+alt-n,app_id:com.obsproject.Studio

# ── Flameshot 截图 (全屏，无动画) ──
window_rule=no_swallow:1,app_id:flameshot
window_rule=is_fullscreen:1,app_id:flameshot
window_rule=animation_type_open:none,app_id:flameshot
window_rule=animation_type_close:none,app_id:flameshot

# ── Event Tester (不吞并) ──
window_rule=no_swallow:1,title:Event Tester

# ── YesPlayMusic 播放器 (浮动，大尺寸) ──
window_rule=is_floating:1,width:1500,height:900,app_id:yesplaymusic
window_rule=animation_type_open:slide,app_id:yesplaymusic
window_rule=animation_type_close:slide,app_id:yesplaymusic

# ── Clash Verge 代理面板 (浮动，大尺寸) ──
window_rule=is_floating:1,app_id:clash-verge
window_rule=width:1500,height:900,app_id:clash-verge
window_rule=animation_type_open:slide,animation_type_close:slide,app_id:clash-verge

# ── Pot 翻译/OCR (浮动) ──
window_rule=is_floating:1,width:1500,height:900,app_id:pot,title:Recognize
# ── WPS 全系列 (浮动，无动画/阴影/圆角/边框) ──
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,no_shadow:1,no_radius:1,no_border:1,app_id:^wps$|^wpp$|^et$
# ── Blueman 蓝牙管理器 (浮动) ──
window_rule=is_floating:1,app_id:blueman-manager
window_rule=width:1500,height:900,app_id:blueman-manager

# ── R 绘图窗口 (X11 图形设备, 浮动) ──
window_rule=is_floating:1,app_id:^R_x11$

# ── 系统对话框/图片查看 (浮动一次、zoom 动画) ──
window_rule_once=is_floating:1,title:图片查看器
window_rule_once=is_floating:1,title:预览
window_rule_once=is_floating:1,title:图片查看
window_rule_once=is_floating:1,title:选择文件
window_rule_once=is_floating:1,title:打开文件
window_rule_once=is_floating:1,app_id:python3,title:qxdrag

window_rule=animation_type_open:zoom,title:图片查看器
window_rule=animation_type_open:zoom,title:图片查看
window_rule=animation_type_open:zoom,title:选择文件
window_rule=animation_type_open:zoom,title:打开文件
window_rule=animation_type_open:zoom,app_id:python3,title:qxdrag

# ── qxdrag (浮动、zoom 动画) ──
window_rule=is_floating:1,app_id:qxdrag.py
window_rule=animation_type_open:zoom,app_id:qxdrag.py
window_rule=animation_type_close:zoom,app_id:qxdrag.py
# ── Satty 截图标注 (zoom 关闭) ──
window_rule=animation_type_close:zoom,app_id:^com.gabm.satty$

# ── 终端识别 ──
window_rule=is_term:1,app_id:alacritty
# ── Telegram (静默切标签: 接受消息时不自动跳转) ──
window_rule=is_tag_silent:1,app_id:org.telegram.desktop

# ── 固定标签绑定 ──
window_rule=tags:4,app_id:Google-chrome
window_rule=tags:3,app_id:QQ
window_rule=tags:2,app_id:mpv
window_rule=tags:5,app_id:^wps$|^wpp$|^et$

# ── 特殊工作区 (Tag 0) 常驻 ──
# OBS 面板: 任何标签下 SUPER+0 一键召唤 (app_id 精确匹配, 避免误伤 obsidian)
window_rule=tags:0,app_id:com.obsproject.Studio

# ── WeChat (无动画，无淡入淡出) ──
window_rule=animation_type_open:none,no_fade_in:1,title:wechat
window_rule=animation_type_close:none,no_fade_out:1,title:wechat
# ── BongoCat 桌宠 (覆盖层、无边框、全局外隐藏) ──
window_rule=is_floating:1,is_overlay:1,no_border:1,is_unmanaged_global:1,width:400,height:400,offset_x:9999,offset_y:9999,app_id:bongo-cat,title:BongoCat
# ── mpv 小窗预览 (覆盖层) ──
window_rule=is_floating:1,is_overlay:1,no_border:1,is_unmanaged_global:1,width:280,height:200,offset_x:9999,offset_y:9999,app_id:mpv,title:video0 - mpv
# ── 百度网盘 (浮动，固定大小) ──
window_rule=is_floating:1,no_size_hint:1,width:1500,height:900,app_id:baidunetdisk,title:百度网盘
# ── Satty (浮动 + 覆盖层) ──
window_rule=is_floating:1,is_overlay:1,app_id:^com.gabm.satty$

# ── 保持透明度 1.0 的应用 (不跟随全局 unfocused_opacity) ──
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^mpv$
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^obsidian$
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^Google-chrome$
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^QQ$

# ── Nautilus 文件管理器 (命名 scratchpad: SUPER+E 唤出/隐藏, 浮动、宽屏) ──
window_rule=is_named_scratchpad:1,is_floating:1,width:1200,height:800,app_id:org.gnome.Nautilus
window_rule=animation_type_open:slide,animation_type_close:fade,app_id:org.gnome.Nautilus

# ── Named scratchpad (0.17.0: 支持显隐动画) ──
window_rule=is_named_scratchpad:1,is_floating:1,width:1200,height:800,title:yaziscratch
window_rule=animation_type_open:slide,animation_type_close:fade,title:yaziscratch
window_rule=is_named_scratchpad:1,width:900,height:600,app_id:cheatsheet
window_rule=animation_type_open:zoom,animation_type_close:fade,app_id:cheatsheet

# ═══════════════════ 图层规则 (Layer Shell) ═══════════════════
# 格式: layer_rule=<属性>:<值>,layer_name:<名称>
# selection = mark-shot/截图选区 (无模糊、无动画)
layer_rule=no_blur:1,no_animation:1,layer_name:selection
# dimland = 截图/锁屏遮罩
layer_rule=no_blur:1,no_animation:1,layer_name:dimland_layer
# launcher = DMS spotlight (zoom 动画)
layer_rule=animation_type_open:zoom,layer_name:launcher
layer_rule=animation_type_close:zoom,layer_name:launcher
# hyprpicker = 取色器 (无动画/模糊/阴影)
layer_rule=no_animation:1,no_blur:1,no_shadow:1,layer_name:hyprpicker
# showkeys = 按键显示 (无动画)
layer_rule=no_animation:1,layer_name:showkeys
# just-talk overlay = 语音悬浮球 (无阴影, 避免 mango layer_shadows=1 投射阴影)
layer_rule=no_shadow:1,layer_name:just-talk-overlay
