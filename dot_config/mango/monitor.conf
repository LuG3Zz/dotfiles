# ── 显示器规则 ──
# 格式: monitor_rule=name:<名称>,width:<宽>,height:<高>,refresh:<刷新率>,x:<x>,y:<y>,scale:<缩放>,vrr:<可变刷新率>,rr:<旋转>
# monitor_rule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:10,scale:1,vrr:0,rr:0
# 16 吋 CSOT 内屏 (eDP-1): 2560x1600@60Hz (EDID 实测 V 范围 40-60Hz), 分数缩放 1.25
monitor_rule=name:eDP-1,width:2560,height:1600,refresh:60,x:0,y:0,scale:1.25,vrr:0,rr:0
monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,vrr:0,rr:0
monitor_rule=name:HDMI-A-2,width:1920,height:1080,refresh:60,x:0,y:1080,scale:1,vrr:0,rr:0
