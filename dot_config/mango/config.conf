# ── DMS 自动生成 (显示器) ──
# 注意: colors/location 两行 source 已切断 —— DMS ≤1.6.3 不支持 mango 0.18 snake 键,
# 仍按 0.17 旧键生成 colors.conf/layout.conf, 会被 0.18 拒绝且每次重写都再次报错。
# 对应值已固化到 appearance.conf 末尾; 待 DMS 1.7 (含方言检测) 发布后可恢复这两行。
source=~/.config/mango/dms/outputs.conf

# ── mango 核心模块 ──
source=./effect.conf
source=./animation.conf
source=./tiling.conf
source=./appearance.conf
source=./overview.conf
source=./misc.conf

# ── 子配置 ──
source=./env.conf
source=./bind.conf
source=./rule.conf
source=./monitor.conf
source=./tag.conf

# ── 自启动 ──
exec_once=~/.config/mango/autostart.sh

# ── DMS 光标 (最后加载, 覆盖 misc.conf 中的光标设置) ──
source=./dms/cursor.conf
