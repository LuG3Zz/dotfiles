; async tasks 全局配置
; 参考: https://github.com/skywind3000/asynctasks.vim
;
; <leader>X          → file-run   （按文件类型直接运行）
; <leader>Cc         → file-build （只编译，报错进 quickfix 可跳转）
; <leader>Cb/Ct/Ck/Cl → cargo build/test/check/clippy
; <leader>Cp         → crates 面板（Cargo.toml）
;
; 项目根识别标记: .git / .root / .svn / .hg（rust/go 命令自身会向上找项目根）

[file-run]
; 默认（未匹配到文件类型时）：直接执行文件本身
command="$(VIM_FILEPATH)"
; C：编译到源文件旁再运行
command:c=gcc -Wall -std=c17 -O2 "$(VIM_FILEPATH)" -o "$(VIM_FILEDIR)/$(VIM_FILENOEXT)" && "$(VIM_FILEDIR)/$(VIM_FILENOEXT)"
; C++：同上，用 g++
command:cpp=g++ -Wall -std=c++17 -O2 "$(VIM_FILEPATH)" -o "$(VIM_FILEDIR)/$(VIM_FILENOEXT)" && "$(VIM_FILEDIR)/$(VIM_FILENOEXT)"
command:rust=cargo run
command:go=go run "$(VIM_FILEPATH)"
command:python=python3 "$(VIM_FILENAME)"
command:javascript=node "$(VIM_FILENAME)"
command:typescript=npx tsx "$(VIM_FILENAME)"
command:typescriptreact=npx tsx "$(VIM_FILENAME)"
command:sh=bash "$(VIM_FILENAME)"
command:zsh=zsh "$(VIM_FILENAME)"
command:lua=lua "$(VIM_FILENAME)"
command:perl=perl "$(VIM_FILENAME)"
command:ruby=ruby "$(VIM_FILENAME)"
command:r=Rscript "$(VIM_FILENAME)"
command:markdown=glow "$(VIM_FILENAME)"
command:html=xdg-open "$(VIM_FILEPATH)"
output=terminal
cwd=$(VIM_FILEDIR)
save=2

[file-build]
; 只编译当前文件（错误输出到 quickfix，可用 ]q/[q 或 <leader>xq 浏览）
command:c=gcc -Wall -std=c17 -O2 "$(VIM_FILEPATH)" -o "$(VIM_FILEDIR)/$(VIM_FILENOEXT)"
command:cpp=g++ -Wall -std=c++17 -O2 "$(VIM_FILEPATH)" -o "$(VIM_FILEDIR)/$(VIM_FILENOEXT)"
command:rust=cargo build
command:go=go build -o "$(VIM_FILEDIR)/$(VIM_FILENOEXT)" "$(VIM_FILEPATH)"
output=quickfix
cwd=$(VIM_FILEDIR)
save=2

[cargo-build]
command=cargo build
cwd=$(VIM_FILEDIR)
output=terminal
save=2

[cargo-test]
command=cargo test
cwd=$(VIM_FILEDIR)
output=terminal
save=2

[cargo-check]
command=cargo check
cwd=$(VIM_FILEDIR)
output=terminal
save=2

[cargo-clippy]
command=cargo clippy
cwd=$(VIM_FILEDIR)
output=terminal
save=2
