; async tasks 全局配置
; :AsyncTask file-run 运行当前文件

[file-run]
command = cd "$(VIM_FILEDIR)" && ext=$(VIM_FILEEXT) && case $ext in .py) python3 "$(VIM_FILEPATH)" ;; .lua) lua "$(VIM_FILEPATH)" ;; .sh|.bash) bash "$(VIM_FILEPATH)" ;; .zsh) zsh "$(VIM_FILEPATH)" ;; .rs) cargo run ;; .c) gcc "$(VIM_FILEPATH)" -o /tmp/a.out && /tmp/a.out ;; .cpp|.cc|.cxx) g++ "$(VIM_FILEPATH)" -o /tmp/a.out && /tmp/a.out ;; .js|.mjs) node "$(VIM_FILEPATH)" ;; .ts|.tsx) npx tsx "$(VIM_FILEPATH)" ;; .go) go run "$(VIM_FILEPATH)" ;; .rb) ruby "$(VIM_FILEPATH)" ;; .md) glow "$(VIM_FILEPATH)" ;; *) echo "no runner for $ext" ;; esac
output  = terminal
