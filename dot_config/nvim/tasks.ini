; async tasks 全局配置
; 参考官方文档: https://github.com/skywind3000/asynctasks.vim

[file-run]
command="$(VIM_FILEPATH)"
command:python=python3 "$(VIM_FILENAME)"
command:c,cpp="$(VIM_PATHNOEXT)"
command:go="$(VIM_PATHNOEXT)"
command:rust=cargo run
command:javascript,js=node "$(VIM_FILENAME)"
command:typescript,ts=npx tsx "$(VIM_FILENAME)"
command:sh,bash=bash "$(VIM_FILENAME)"
command:zsh=zsh "$(VIM_FILENAME)"
command:lua=lua "$(VIM_FILENAME)"
command:perl=perl "$(VIM_FILENAME)"
command:ruby=ruby "$(VIM_FILENAME)"
command:html=xdg-open "$(VIM_FILEPATH)"
command:markdown,md=glow "$(VIM_FILEPATH)"
output=terminal
cwd=$(VIM_FILEDIR)
save=2
